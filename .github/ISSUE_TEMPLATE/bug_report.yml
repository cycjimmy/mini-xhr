name: Bug report
description: Create a report to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so the issue can be triaged quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of @cycjimmy/mini-xhr you are using.
      placeholder: 8.0.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where the request runs, how the package is imported, and the bundler or framework in use.
      placeholder: |
        Browser: Chrome 140 (or Node.js: 22.22.2)
        Import: `import miniXhr from '@cycjimmy/mini-xhr'` (or UMD script tag)
        Bundler: Vite 8 / webpack 5 / none
        OS: macOS 15
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior, or a minimal demo (repository / code sandbox) that shows the request failing.
      placeholder: |
        1. Call `miniXhr.get('/api', { timeout: 500 })`
        2. ...
        3. See error
      render: text
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: The request call, the settings you pass, and the server response status/headers if relevant.
      placeholder: |
        miniXhr.post('/api', { params: { a: 1 }, headers: { h1: 'v1' } })
      render: text

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: The console error and the request entry from the browser devtools network panel, if available.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.

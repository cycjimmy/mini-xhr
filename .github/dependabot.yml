version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    labels:
      - dependencies
    open-pull-requests-limit: 10
    # jest* is left ungrouped on purpose: its majors need to be reviewed on
    # their own instead of riding along with an unrelated bump.
    groups:
      lint:
        patterns:
          - eslint
          - '@antfu/*'
          - globals
          - stylelint
          - stylelint-config-*
      build:
        patterns:
          - vite
          - terser
          - trash-cli
          - fs-extra
          - cross-env
          - '@cycjimmy/config-lib'
